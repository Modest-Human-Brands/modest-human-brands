services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - NITRO_PUBLIC_DOC_URL=http://doc:3000
    volumes:
      - modest-human-brands_data:/app/.data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 3000:3000

  connect:
    build: ../code-connect
    env_file:
      - .env
    volumes:
      - mconnect-config:/app/config
      - mconnect-data:/app/.data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 5100:3000

  connect-ui:
    build: ../code-connect-app
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 5101:8080

  livekit:
    image: livekit/livekit-server:latest@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    command: --config /etc/livekit.yaml
    # ports:
    #   - "7881:7881/tcp"
    #   - "7882:7882/udp"
    #   - "50000-60000:50000-60000/udp"
    volumes:
      - /root/modest-human-brands/mconnect/config/livekit.yaml:/etc/livekit.yaml
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  livekit-egress:
    image: livekit/egress:latest@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - /root/modest-human-brands/mconnect/config/egress.yaml:/etc/egress.yaml
      - /root/modest-human-brands/mconnect/recordings:/recordings
    depends_on:
      - livekit
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  livekit-sip:
    image: livekit/sip:latest@sha256:1487f39ca985f64879cc74b045e1ddc22f7afdb02e8a4739d92d749b9c3c3ad2
    ports:
      - '5060:5060/udp'
      - '5060:5060/tcp'
      - '10000-10100:10000-10100/udp'
    volumes:
      - /root/modest-human-brands/mconnect/config/sip.yaml:/sip/config.yaml
    depends_on:
      - livekit
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  livekit-redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  doc:
    build: ../code-doc
    env_file:
      - .env
    volumes:
      - mdoc-asset:/app/asset
      - mdoc-document:/app/document
      - mdoc-static:/app/static
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 3002:3000

  drive:
    image: ghcr.io/modest-human-brands/mdrive:latest@sha256:4498fc81e2fbabffb589f0b0c85ed5e4cf4d420f8bd56258dcb21cffb8e8d520
    env_file:
      - .env
    volumes:
      - mdrive-data:/app/data
      - mdrive-static:/app/static
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  media:
    image: ghcr.io/modest-human-brands/mmedia:latest@sha256:46adfeebe55fe47ce909be7ab7a9d3cee04b4f9b72e30100fb01023a71055338
    env_file:
      - .env
    volumes:
      - mdrive-static:/app/static
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 1024M

volumes:
  modest-human-brands_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./.data

  mconnect-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-connect/config
  mconnect-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-connect/.data

  mdoc-asset:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-doc/asset
  mdoc-document:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-doc/document
  mdoc-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-doc/static

  mdrive-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../mdrive/data
  mdrive-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../mdrive/static
