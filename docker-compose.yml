services:
  app:
    build: .
    env_file:
      - .env
    environment:
      - NITRO_PUBLIC_DOC_URL=http://doc:3000
    volumes:
      - modest-human-brands_data:/app/.data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 3000:3000

  connect:
    build: ../code-connect
    env_file:
      - .env
    volumes:
      - mconnect-config:/app/config
      - mconnect-data:/app/.data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 3002:3000

  wap:
    build: ../code-wap
    env_file:
      - .env
    volumes:
      - mwap-data:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 3001:3000

  connect-ui:
    build: ../code-connect-app
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 5101:8080

  livekit:
    image: livekit/livekit-server:latest@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    command: --config /etc/livekit.yaml
    # ports:
    #   - "7881:7881/tcp"
    #   - "7882:7882/udp"
    #   - "50000-60000:50000-60000/udp"
    volumes:
      - /root/modest-human-brands/mconnect/config/livekit.yaml:/etc/livekit.yaml
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  livekit-egress:
    image: livekit/egress:latest@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - /root/modest-human-brands/mconnect/config/egress.yaml:/etc/egress.yaml
      - /root/modest-human-brands/mconnect/recordings:/recordings
    depends_on:
      - livekit
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  livekit-sip:
    image: livekit/sip:latest@sha256:7cff1d8a42ca069b099bbf7a6796f8ae91e5b600b88288af362bc9db700e75ff
    ports:
      - '5060:5060/udp'
      - '5060:5060/tcp'
      - '10000-10100:10000-10100/udp'
    volumes:
      - /root/modest-human-brands/mconnect/config/sip.yaml:/sip/config.yaml
    depends_on:
      - livekit
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  livekit-redis:
    image: redis:8-alpine@sha256:47b08295737773de3b711fb86f13ae802f5074e96a9a2d29f5f80164ac08c046
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  doc:
    build: ../code-doc
    env_file:
      - .env
    volumes:
      - mdoc-asset:/app/asset
      - mdoc-document:/app/document
      - mdoc-static:/app/static
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 3003:3000

  drive:
    image: ghcr.io/modest-human-brands/mdrive:latest@sha256:8c0438ae976b421a59afd4024d53e199748498b7413d9b8080ebd4e1549e659b
    env_file:
      - .env
    volumes:
      - mdrive-data:/app/data
      - mdrive-static:/app/static
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - 3004:3000

  media:
    image: ghcr.io/modest-human-brands/mmedia:latest@sha256:3366652f9920efbdd335f003a8033b7a2af43a0c60916053f99de13f539a8946
    env_file:
      - .env
    volumes:
      - mdrive-static:/app/static
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 1024M
    ports:
      - 3005:3111

volumes:
  modest-human-brands_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./.data

  mconnect-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-connect/config
  mconnect-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-connect/.data

  mwap-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-wap/data

  mdoc-asset:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-doc/asset
  mdoc-document:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-doc/document
  mdoc-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../code-doc/static

  mdrive-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../mdrive/data
  mdrive-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../mdrive/static
