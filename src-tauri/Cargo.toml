[package]
name = "modest-human-brands"
description = "The Project Management Software Integrating MWap, MConnect, MDoc, MCoordinate, MSync, MMedia, MDrive, MAssist"
authors = ["Shirsendu Bairagi <shirsendu2001@gmail.com>"]
license = "MIT"
repository = "https://github.com/Modest-Human-Brands/modest-human-brands.git"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11.0"
