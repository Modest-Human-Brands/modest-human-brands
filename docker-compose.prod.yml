services:
  app:
    image: ghcr.io/modest-human-brands/modest-human-brands:latest@sha256:908b81b8baf0302d1c2aa251cee5367a64f100b9eb101dca0ce0ddec62a7b2e6
    env_file:
      - .env
    volumes:
      - modest-human-brands_data:/app/.data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - connect
      - doc
      - drive
      - media
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect:
    image: ghcr.io/modest-human-brands/mconnect:latest@sha256:0c9fb5de673c63b8cb15346ce31adf14487b3517e7b778369c47ff676cd4ced8
    env_file:
      - .env
    volumes:
      - mconnect-config:/app/config
      - mconnect-data:/app/.data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - livekit
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-ui:
    image: ghcr.io/modest-human-brands/mconnect-web:latest@sha256:909c9a54d06d2d20e01872dd629b37a94b19d68a8aad50ce9470f3d9701da314
    env_file:
      - .env
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit:
    image: livekit/livekit-server:latest@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    command: --config /etc/livekit.yaml
    # ports:
    #   - "7881:7881/tcp"
    #   - "7882:7882/udp"
    #   - "50000-60000:50000-60000/udp"
    volumes:
      - /root/modest-human-brands/mconnect/config/livekit.yaml:/etc/livekit.yaml
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:7880/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit-egress:
    image: livekit/egress:latest@sha256:bf2b648b947349c3e9ff7aa8c718f00378d5c06af7624652a3653318e00333ce
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - /root/modest-human-brands/mconnect/config/egress.yaml:/etc/egress.yaml
      - /root/modest-human-brands/mconnect/recordings:/recordings
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:7980/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit-sip:
    image: livekit/sip:latest@sha256:1487f39ca985f64879cc74b045e1ddc22f7afdb02e8a4739d92d749b9c3c3ad2
    ports:
      - '5060:5060/udp'
      - '5060:5060/tcp'
      - '10000-10100:10000-10100/udp'
    volumes:
      - /root/modest-human-brands/mconnect/config/sip.yaml:/sip/config.yaml
    networks:
      - internal
    # healthcheck:
    #   test: [ "CMD-SHELL", "exec 6<>/dev/tcp/localhost/5060 || exit 1" ]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 15s
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit-redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  doc:
    image: ghcr.io/modest-human-brands/mdoc:latest@sha256:90841af1cf724280011334f0e644392cfa61480336d77fe32462fd70716d3450
    env_file:
      - .env
    volumes:
      - mdoc-asset:/app/asset
      - mdoc-document:/app/document
      - mdoc-static:/app/static
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  drive:
    image: ghcr.io/modest-human-brands/mdrive:latest@sha256:4498fc81e2fbabffb589f0b0c85ed5e4cf4d420f8bd56258dcb21cffb8e8d520
    env_file:
      - .env
    volumes:
      - mdrive-data:/app/.data
      - mdrive-static:/app/static
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  media:
    image: ghcr.io/modest-human-brands/mmedia:latest@sha256:46adfeebe55fe47ce909be7ab7a9d3cee04b4f9b72e30100fb01023a71055338
    env_file:
      - .env
    volumes:
      - mdrive-static:/app/static
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:3111/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 1024M

volumes:
  modest-human-brands_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/.data
  mconnect-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mconnect/config
  mconnect-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mconnect/.data
  mdoc-asset:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdoc/asset
  mdoc-document:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdoc/document
  mdoc-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdoc/static
  mdrive-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdrive/.data
  mdrive-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdrive/static

networks:
  internal:
    driver: overlay
