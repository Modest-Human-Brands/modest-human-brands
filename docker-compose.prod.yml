services:
  app:
    image: ghcr.io/modest-human-brands/modest-human-brands:latest@sha256:e977fb3c31aee1985cf1c51fa0b934fc687147a58e7b63a59f4706c32a832718
    env_file:
      - .env
    volumes:
      - modest-human-brands_data:/app/.data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - connect
      - doc
      - drive
      - media
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect:
    image: ghcr.io/modest-human-brands/mconnect:latest@sha256:c3fc727b8890f8de6608427526d68b89cf626c6b5a25138529ea816fd3153e80
    env_file:
      - .env
    volumes:
      - mconnect-config:/app/config
      - mconnect-data:/app/.data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - livekit
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-ui:
    image: ghcr.io/modest-human-brands/mconnect-web:latest@sha256:909c9a54d06d2d20e01872dd629b37a94b19d68a8aad50ce9470f3d9701da314
    env_file:
      - .env
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit:
    image: livekit/livekit-server:latest@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    command: --config /etc/livekit.yaml
    # ports:
    #   - "7881:7881/tcp"
    #   - "7882:7882/udp"
    #   - "50000-60000:50000-60000/udp"
    volumes:
      - /root/modest-human-brands/mconnect/config/livekit.yaml:/etc/livekit.yaml
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:7880/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit-egress:
    image: livekit/egress:latest@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - /root/modest-human-brands/mconnect/config/egress.yaml:/etc/egress.yaml
      - /root/modest-human-brands/mconnect/recordings:/recordings
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:7980/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit-sip:
    image: livekit/sip:latest@sha256:6a5e2080fffa3da798bc035aa1587590963655e4c889535cc1cf7a181a6334d3
    ports:
      - '5060:5060/udp'
      - '5060:5060/tcp'
      - '10000-10100:10000-10100/udp'
    volumes:
      - /root/modest-human-brands/mconnect/config/sip.yaml:/sip/config.yaml
    networks:
      - internal
    # healthcheck:
    #   test: [ "CMD-SHELL", "exec 6<>/dev/tcp/localhost/5060 || exit 1" ]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 15s
    depends_on:
      - livekit-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  connect-livekit-redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  doc:
    image: ghcr.io/modest-human-brands/mdoc:latest@sha256:be698f62465a42e11fe5a698792b66ce965c54944b3bdcb8f0a93741c116b727
    env_file:
      - .env
    volumes:
      - mdoc-asset:/app/asset
      - mdoc-document:/app/document
      - mdoc-static:/app/static
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  drive:
    image: ghcr.io/modest-human-brands/mdrive:latest@sha256:4498fc81e2fbabffb589f0b0c85ed5e4cf4d420f8bd56258dcb21cffb8e8d520
    env_file:
      - .env
    volumes:
      - mdrive-data:/app/.data
      - mdrive-static:/app/static
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  media:
    image: ghcr.io/modest-human-brands/mmedia:latest@sha256:46adfeebe55fe47ce909be7ab7a9d3cee04b4f9b72e30100fb01023a71055338
    env_file:
      - .env
    volumes:
      - mdrive-static:/app/static
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:3111/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
        reservations:
          cpus: '1'
          memory: 1024M

volumes:
  modest-human-brands_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/.data
  mconnect-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mconnect/config
  mconnect-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mconnect/.data
  mdoc-asset:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdoc/asset
  mdoc-document:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdoc/document
  mdoc-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdoc/static
  mdrive-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdrive/.data
  mdrive-static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/modest-human-brands/mdrive/static

networks:
  internal:
    driver: overlay
